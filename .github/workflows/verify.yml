name: Verify analytics exercises
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SQL KPI trends
        run: python3 sql-window-kpis/analyze.py
      - name: ETL validation
        run: python3 etl-data-validation/analyze.py
      - name: Fraud threshold evaluation
        run: python3 fraud-threshold-evaluation/analyze.py
